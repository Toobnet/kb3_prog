<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            color: red;
        }
    </style>
</head>
<body>
    <P id="soucet"></P>
    <P id="rozdil"></P>
    <P id="nasobek"></P>
    <P id="podil"></P>
    <script>
        let cislo1 = Number(prompt("Zadej mi cislo: "));
        let cislo2 = Number(prompt("Zadej mi cislo: "));

        document.getElementById("soucet").innerHTML
        ="součet: " + (cislo1 + cislo2);
        document.getElementById("rozdil").innerHTML
         ="rozdil: " + (cislo1 - cislo2);
         document.getElementById("nasobek").innerHTML
         ="nasobek: " + (cislo1 * cislo2);
        document.getElementById("podil").innerHTML
         ="podil: " + (cislo1 / cislo2);
    </script>
</body>
</html>
